server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: geda-backend
  profiles:
    active: dev
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-real-deployments-only-for-local-dev}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  pending-ttl-minutes: ${JWT_PENDING_TTL_MINUTES:5}

app:
  otp:
    dev-expose: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
