server:
  port: 8080
  servlet:
    context-path: /api

spring:
  application:
    name: geda-backend
  profiles:
    active: dev
  datasource:
    # prepareThreshold=0 disables server-side prepared statements — required
    # when connecting through Supabase's transaction-mode pooler (PgBouncer),
    # since a "prepared" statement name can collide across the different
    # underlying connections PgBouncer transparently swaps between requests.
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:postgres}?sslmode=require&prepareThreshold=0
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:2}
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
    schemas: public
    baseline-on-migrate: true
    baseline-version: 0

jwt:
  secret: ${JWT_SECRET:change-this-to-a-long-random-secret-in-real-deployments-only-for-local-dev}
  access-ttl-minutes: ${JWT_ACCESS_TTL_MINUTES:15}
  pending-ttl-minutes: ${JWT_PENDING_TTL_MINUTES:5}

cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://solariotscada.vercel.app}

app:
  otp:
    dev-expose: false

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
